aid: aidoc
name: Aidoc
description: >-
  Aidoc is a clinical artificial intelligence company whose aiOS platform runs,
  orchestrates, and governs FDA-cleared clinical AI across health systems. Its
  modules span radiology, cardiology, neurovascular, and vascular care —
  detecting acute findings (stroke, pulmonary embolism, brain aneurysm,
  incidental findings) and coordinating care teams at the point of care. aiOS is
  a vendor-neutral platform that runs both Aidoc and third-party algorithms and
  integrates into existing hospital IT stacks (PACS, EHR, mobile) using standard
  healthcare interoperability protocols (DICOM, HL7, FHIR) rather than a public
  developer REST API. Aidoc reports adoption across more than 1,600 medical
  centers worldwide. Surfaced as a general-catalyst portfolio company and
  enriched here for security posture, interoperability conformance, and identity;
  no public developer API surface is published.
